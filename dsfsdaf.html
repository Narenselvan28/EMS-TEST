    <script>
        // Simple calculation for demo purposes
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('change', function() {
                const row = this.closest('tr');
                if (row) {
                    const rate = parseFloat(row.querySelector('td:nth-child(3)').textContent) || 0;
                    const count = parseFloat(this.value) || 0;
                    const total = rate * count;
                    
                    if (row.querySelector('td:nth-child(5)')) {
                        row.querySelector('td:nth-child(5)').textContent = total.toFixed(2);
                    }
                    
                    updateTotalSalary();
                }
            });
        });
        
        function updateTotalSalary() {
            let total = 0;
            document.querySelectorAll('tbody tr').forEach(row => {
                const totalCell = row.querySelector('td:last-child');
                if (totalCell && totalCell.textContent) {
                    total += parseFloat(totalCell.textContent) || 0;
                }
            });
            
            document.querySelector('.summary-total').textContent = '$' + total.toFixed(2);
        }
        
        // Initialize with some values
        document.addEventListener('DOMContentLoaded', function() {
            updateTotalSalary();
        });
    </script>
